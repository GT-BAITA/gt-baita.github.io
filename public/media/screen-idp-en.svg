<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" lang="en" role="img" aria-labelledby="title">
  <title id="title">IdP SaaS institutional login</title>
  <!-- Prévia vetorial baseada no cartão de login da apresentação do IdP SaaS. -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#d9d9d9"/></pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="12" result="offset"/><feFlood flood-color="#171717" flood-opacity=".09"/><feComposite in2="offset" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect x="112" y="200" width="1056" height="580" rx="20"/></clipPath>
  </defs>
  <rect width="1280" height="980" fill="#fff"/>
  <rect width="1280" height="980" fill="url(#dots)"/>
  <rect x="112" y="200" width="1056" height="580" rx="20" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#card)"><rect x="112" y="200" width="462" height="580" fill="#f4f4f4"/></g>
  <rect x="112" y="200" width="1056" height="580" rx="20" fill="none" stroke="#e5e5e5" stroke-width="2"/>
  <g font-family="'Geist',system-ui,-apple-system,'Segoe UI',sans-serif" fill="#171717">
    <rect x="291" y="351" width="104" height="104" rx="18" fill="#171717"/>
    <text x="343" y="420" text-anchor="middle" font-size="40" font-weight="600" fill="#fafafa">UF</text>
    <text x="343" y="510" text-anchor="middle" font-size="31" font-weight="600">Example</text>
    <text x="343" y="550" text-anchor="middle" font-size="31" font-weight="600">University</text>
    <g transform="translate(1040 234)" fill="none" stroke="#525252" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="9"/><ellipse cx="0" cy="0" rx="4" ry="9"/><path d="M-9 0H9"/>
      <path d="m60-2 5 5 5-5"/>
    </g>
    <text x="1061" y="241" font-size="19" fill="#525252">EN</text>
    <text x="636" y="314" font-size="34" font-weight="600">Sign in</text>
    <text x="636" y="351" font-size="20" fill="#737373">Enter your credentials to continue.</text>
    <text x="636" y="405" font-size="20" font-weight="500">Username or email<tspan fill="#ef4444"> *</tspan></text>
    <rect x="636" y="422" width="468" height="58" rx="10" fill="#fff" stroke="#e5e5e5" stroke-width="2"/>
    <text x="654" y="459" font-size="20" fill="#a3a3a3">example@email.com</text>
    <text x="636" y="525" font-size="20" font-weight="500">Password<tspan fill="#ef4444"> *</tspan></text>
    <rect x="636" y="542" width="468" height="58" rx="10" fill="#fff" stroke="#e5e5e5" stroke-width="2"/>
    <g transform="translate(1068 571)" fill="none" stroke="#737373" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-13 0S-8-8 0-8 13 0 13 0 8 8 0 8-13 0-13 0Z"/><circle r="3"/>
    </g>
    <rect x="636" y="638" width="468" height="58" rx="10" fill="#171717"/>
    <text x="870" y="675" text-anchor="middle" font-size="22" font-weight="500" fill="#fafafa">Sign in</text>
  </g>
</svg>
